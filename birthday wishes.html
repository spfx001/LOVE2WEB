<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Your Love 💕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14040d;
    --glow1: #5c1236;
    --glow2: #2a0716;
    --pink: #ff3f80;
    --pink-deep: #d81b60;
    --pink-soft: #ffb3cf;
    --pink-pale: #ffe2ec;
    --card: rgba(40,10,24,0.55);
    --card-border: rgba(255,143,179,0.35);
    --muted: #e8b8c8;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--pink-pale);
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
  #stars, #fireworks{
    position:fixed; inset:0; width:100%; height:100%;
  }
  #stars{ z-index:0; }
  #fireworks{ z-index:60; pointer-events:none; }
  .glow-bg{
    position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(ellipse 60% 40% at 50% 20%, var(--glow1) 0%, transparent 60%),
      radial-gradient(ellipse 80% 60% at 50% 100%, var(--glow2) 0%, transparent 70%);
  }

  .floaties{ position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
  .floaties span{
    position:absolute;
    opacity:.5;
    font-size:16px;
    animation:drift 7s ease-in-out infinite;
  }
  @keyframes drift{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-16px) rotate(8deg); }
  }

  .app{
    position:relative; z-index:2;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:28px 16px;
  }
  .stage{ display:none; width:100%; max-width:460px; text-align:center; animation:fadeUp .7s ease both; }
  .stage.active{ display:block; }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);} }

  .card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:22px;
    padding:32px 26px;
    backdrop-filter:blur(6px);
    box-shadow:0 0 40px rgba(255,63,128,0.18), 0 25px 50px rgba(0,0,0,.45);
  }

  .eyebrow{
    font-size:11.5px; letter-spacing:.24em; text-transform:uppercase;
    color:var(--pink-soft); margin-bottom:10px; opacity:.85;
  }

  /* ---------- PAGE 0: password lock ---------- */
  .lock-icon{ font-size:38px; margin-bottom:6px; filter:drop-shadow(0 0 12px rgba(255,63,128,.6)); }
  .lock-title{
    font-family:'Dancing Script',cursive; font-weight:700;
    font-size:clamp(26px,6vw,32px); color:var(--pink-pale); margin:2px 0 4px;
    text-shadow:0 0 18px rgba(255,143,179,.5);
  }
  .lock-sub{ font-size:13px; color:var(--muted); margin-bottom:20px; }

  .display{
    background:rgba(0,0,0,0.35);
    border:1px solid var(--card-border);
    border-radius:14px;
    height:56px;
    display:flex; align-items:center; justify-content:flex-end;
    padding:0 18px;
    font-family:'Poppins',sans-serif;
    font-size:28px;
    font-weight:600;
    letter-spacing:.3em;
    color:var(--pink-pale);
    margin-bottom:16px;
    transition:transform .15s ease;
  }
  .display.shake{ animation:shake .4s ease; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-8px); }
    40%{ transform:translateX(8px); }
    60%{ transform:translateX(-6px); }
    80%{ transform:translateX(6px); }
  }

  .keypad{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
  }
  .key{
    background:linear-gradient(180deg, rgba(255,143,179,.16), rgba(255,63,128,.08));
    border:1px solid var(--card-border);
    color:var(--pink-pale);
    font-size:19px;
    font-weight:500;
    border-radius:12px;
    padding:14px 0;
    cursor:pointer;
    transition:background .18s ease, transform .12s ease;
  }
  .key:hover{ background:linear-gradient(180deg, rgba(255,143,179,.28), rgba(255,63,128,.16)); }
  .key:active{ transform:scale(.94); }
  .key.wide{ grid-column:span 1; }
  .key.clear{ color:var(--pink-soft); font-size:14px; letter-spacing:.05em; }
  .key.enter{
    background:linear-gradient(135deg,var(--pink),var(--pink-deep));
    border:none; font-weight:700;
  }
  .key.enter:hover{ filter:brightness(1.08); }

  .error-msg{
    margin-top:14px; font-size:14px; color:var(--pink-soft);
    min-height:20px; font-weight:500;
  }

  /* ---------- PAGE 1: birthday + letter ---------- */
  .bday-title{
    font-family:'Baloo 2',sans-serif; font-weight:700;
    line-height:1.05;
    font-size:clamp(30px,9vw,50px);
    color:#fff;
    text-shadow:0 0 22px rgba(255,63,128,.6), 0 0 4px rgba(255,255,255,.6);
    margin:0;
  }
  .bday-title .name{
    display:block;
    color:var(--pink-soft);
    font-size:clamp(26px,8vw,44px);
  }
  .env-wrap{ margin:22px auto 6px; }
  .env-hint{ font-size:13px; color:var(--muted); margin-top:10px; }

  .envelope-box{
    width:150px; height:100px;
    margin:10px auto 0;
    position:relative;
    cursor:pointer;
    transition:opacity .5s ease, transform .5s ease;
  }
  .envelope-box.hidden-el{ opacity:0; transform:scale(.85); pointer-events:none; position:absolute; }
  .env-back{
    position:absolute; inset:0;
    background:linear-gradient(180deg,#3a0f22,#2a0716);
    border:1px solid var(--card-border);
    border-radius:8px;
  }
  .env-flap-top{
    position:absolute; top:0; left:0; right:0; height:55%;
    background:linear-gradient(160deg,#4a1530,#3a0f22);
    clip-path:polygon(0 0,100% 0,50% 85%);
    border-radius:8px 8px 0 0;
  }
  .heart-seal{
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    font-size:30px;
    filter:drop-shadow(0 0 10px rgba(255,63,128,.7));
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ transform:translate(-50%,-50%) scale(1); } 50%{ transform:translate(-50%,-50%) scale(1.12); } }

  .letter-paper{
    background:#fbf3e9;
    color:#3a2a2e;
    border-radius:6px;
    padding:26px 22px 22px;
    text-align:left;
    max-height:0;
    overflow:hidden;
    opacity:0;
    transform:translateY(14px) scale(.97);
    transition:max-height .7s ease, opacity .6s ease, transform .6s ease, padding .6s ease, margin .6s ease;
    box-shadow:0 20px 45px rgba(0,0,0,.35);
    margin-top:0;
  }
  .letter-paper.open{
    max-height:900px;
    opacity:1;
    transform:translateY(0) scale(1);
    margin-top:18px;
  }
  .letter-paper::before{
    content:"";
    display:block; height:5px; margin:-26px -22px 16px;
    background:linear-gradient(90deg,var(--pink),var(--pink-soft));
  }
  #letterText{
    font-family:'Dancing Script',cursive;
    font-size:19px;
    line-height:1.55;
    white-space:pre-wrap;
    min-height:1.6em;
  }
  .tap-skip{ font-size:11px; color:#9a7d84; margin-top:10px; text-align:right; opacity:.7; }

  /* ---------- PAGE 2: marry me ---------- */
  .heart-icon{ font-size:36px; margin-bottom:4px; }
  .marry-title{
    font-family:'Dancing Script',cursive; font-weight:700;
    font-size:clamp(28px,7vw,36px);
    color:#fff;
    text-shadow:0 0 20px rgba(255,143,179,.6);
    margin:2px 0 18px;
  }
  .ring-row{ font-size:26px; margin-bottom:22px; }
  .ym-buttons{ display:flex; gap:14px; justify-content:center; position:relative; height:52px; }
  .ym-btn{
    padding:12px 26px;
    border-radius:999px;
    font-weight:600;
    font-size:14.5px;
    border:none;
    cursor:pointer;
    transition:transform .15s ease, background .2s ease;
  }
  .ym-btn.yes{ background:linear-gradient(135deg,var(--pink),var(--pink-deep)); color:#fff; }
  .ym-btn.yes:hover{ transform:translateY(-2px); }
  .ym-btn.no{
    background:rgba(255,255,255,0.08);
    color:var(--pink-pale);
    border:1px solid var(--card-border);
    position:relative;
    transition:transform .18s ease;
  }

  .popup-overlay{
    position:fixed; inset:0; z-index:70;
    background:rgba(10,2,6,0.72);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition:opacity .35s ease;
  }
  .popup-overlay.show{ opacity:1; pointer-events:auto; }
  .popup-card{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:22px;
    padding:30px 28px 26px;
    max-width:300px;
    text-align:center;
    transform:scale(.85);
    transition:transform .35s cubic-bezier(.34,1.56,.64,1);
    box-shadow:0 0 50px rgba(255,63,128,.3);
  }
  .popup-overlay.show .popup-card{ transform:scale(1); }
  .teddy-msg{
    font-family:'Dancing Script',cursive;
    font-size:22px;
    color:var(--pink-soft);
    margin:14px 0 18px;
    line-height:1.4;
  }
  .popup-close{
    background:linear-gradient(135deg,var(--pink),var(--pink-deep));
    border:none; color:#fff; font-weight:600;
    padding:10px 22px; border-radius:999px; cursor:pointer; font-size:13.5px;
  }

  /* ---------- PAGE 3: photos ---------- */
  .photos-row{
    display:flex; gap:14px; justify-content:center;
    flex-wrap:wrap; margin:20px 0 6px;
  }
  .photo-slot{
    width:150px; height:190px;
    border:1px solid var(--card-border);
    border-radius:14px;
    overflow:hidden;
    position:relative;
    background:rgba(255,255,255,0.02);
    box-shadow:0 14px 30px rgba(0,0,0,.4), 0 0 0 1px rgba(255,143,179,.08);
    transform:rotate(-3deg);
  }
  .photo-slot:nth-child(2){ transform:rotate(3deg); }
  .photo-slot img{ width:100%; height:100%; object-fit:cover; display:block; }
  .enjoy-text{
    font-family:'Dancing Script',cursive;
    font-size:clamp(22px,6vw,28px);
    color:var(--pink-soft);
    margin-top:18px;
    text-shadow:0 0 16px rgba(255,143,179,.5);
  }

  /* ---------- next button ---------- */
  .next-fab{
    position:fixed;
    bottom:26px; left:50%; transform:translateX(-50%);
    background:linear-gradient(135deg,var(--pink),var(--pink-deep));
    color:#fff;
    border:none;
    padding:11px 22px;
    border-radius:999px;
    font-size:13.5px;
    font-weight:600;
    display:flex; align-items:center; gap:6px;
    cursor:pointer;
    box-shadow:0 10px 26px rgba(255,63,128,.4);
    z-index:40;
    opacity:0;
    pointer-events:none;
    transition:opacity .4s ease, transform .2s ease;
  }
  .next-fab.show{ opacity:1; pointer-events:auto; }
  .next-fab:hover{ transform:translateX(-50%) translateY(-2px); }

  @media (max-width:380px){
    .keypad{ gap:8px; }
    .key{ padding:12px 0; font-size:17px; }
    .photo-slot{ width:112px; height:130px; }
  }
</style>
</head>
<body>

<canvas id="stars"></canvas>
<div class="glow-bg"></div>
<canvas id="fireworks"></canvas>
<div class="floaties" id="floaties"></div>

<div class="app">

  <!-- PAGE 0: PASSWORD LOCK -->
  <section class="stage active" data-stage="0">
    <div class="card">
      <div class="lock-icon">🔒</div>
      <div class="lock-title">Enter the code, Your Love</div>
      <div class="lock-sub">only she knows the number that unlocks this</div>
      <div class="display" id="display">&nbsp;</div>
      <div class="keypad" id="keypad">
        <button class="key" data-k="1">1</button>
        <button class="key" data-k="2">2</button>
        <button class="key" data-k="3">3</button>
        <button class="key" data-k="4">4</button>
        <button class="key" data-k="5">5</button>
        <button class="key" data-k="6">6</button>
        <button class="key" data-k="7">7</button>
        <button class="key" data-k="8">8</button>
        <button class="key" data-k="9">9</button>
        <button class="key clear" data-k="clear">C</button>
        <button class="key" data-k="0">0</button>
        <button class="key enter" data-k="enter">✓</button>
      </div>
      <div class="error-msg" id="errorMsg">&nbsp;</div>
    </div>
  </section>

  <!-- PAGE 1: HAPPY BIRTHDAY + LETTER -->
  <section class="stage" data-stage="1">
    <h1 class="bday-title">HAPPY<br>BIRTHDAY<span class="name">YOUR LOVE 💝</span></h1>

    <div class="env-wrap">
      <div class="envelope-box" id="envelopeBox">
        <div class="env-back"></div>
        <div class="env-flap-top"></div>
        <div class="heart-seal">💌</div>
      </div>
      <div class="env-hint" id="envHint">tap the heart to open your letter</div>

      <div class="letter-paper" id="letterPaper">
        <div id="letterText"></div>
        <div class="tap-skip" id="skipHint">tap to skip ✍️</div>
      </div>
    </div>
  </section>

  <!-- PAGE 2: WILL YOU MARRY ME -->
  <section class="stage" data-stage="2">
    <div class="card">
      <div class="heart-icon">💖✨</div>
      <div class="marry-title">Will you marry me?</div>
      <div class="ring-row">💍 ❤️</div>
      <div class="ym-buttons">
        <button class="ym-btn yes" id="yesBtn">Yes 🥹</button>
        <button class="ym-btn no" id="noBtn">No 🙈</button>
      </div>
    </div>
  </section>

  <!-- PAGE 3: PHOTOS -->
  <section class="stage" data-stage="3">
    <div class="eyebrow">just us</div>
    <div class="photos-row">

  <div class="popup-card">

    </svg>

    <button class="popup-close" id="popupClose">aww 🥰</button>
  </div>
</div>

<script>
(function(){

  /* ---------------- background: stars ---------------- */
  var starCanvas = document.getElementById('stars');
  var sctx = starCanvas.getContext('2d');
  var stars = [];
  function resizeStars(){
    starCanvas.width = window.innerWidth;
    starCanvas.height = window.innerHeight;
    stars = [];
    var count = Math.floor((window.innerWidth*window.innerHeight)/8000);
    for(var i=0;i<count;i++){
      stars.push({ x:Math.random()*starCanvas.width, y:Math.random()*starCanvas.height,
        r:Math.random()*1.3+0.3, phase:Math.random()*Math.PI*2, speed:Math.random()*0.02+0.01 });
    }
  }
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function drawStars(t){
    sctx.clearRect(0,0,starCanvas.width, starCanvas.height);
    stars.forEach(function(s){
      var tw = reduceMotion ? .8 : .5+.5*Math.sin(s.phase+t*s.speed);
      sctx.globalAlpha = tw;
      sctx.fillStyle = '#ffe2ec';
      sctx.beginPath(); sctx.arc(s.x,s.y,s.r,0,Math.PI*2); sctx.fill();
    });
    sctx.globalAlpha = 1;
    requestAnimationFrame(drawStars);
  }
  resizeStars();
  window.addEventListener('resize', resizeStars);
  requestAnimationFrame(drawStars);

  /* floating hearts/flowers decoration */
  var floatEmojis = ['💗','🌸','💕','✨','🌷'];
  var floatiesEl = document.getElementById('floaties');
  for(var i=0;i<14;i++){
    var s = document.createElement('span');
    s.textContent = floatEmojis[Math.floor(Math.random()*floatEmojis.length)];
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*100+'%';
    s.style.fontSize = (12+Math.random()*14)+'px';
    s.style.animationDuration = (5+Math.random()*5)+'s';
    s.style.animationDelay = (Math.random()*4)+'s';
    floatiesEl.appendChild(s);
  }

  /* ---------------- fireworks ---------------- */
  var fwCanvas = document.getElementById('fireworks');
  var fctx = fwCanvas.getContext('2d');
  function resizeFW(){ fwCanvas.width = window.innerWidth; fwCanvas.height = window.innerHeight; }
  resizeFW(); window.addEventListener('resize', resizeFW);

  var fwColors = ['#ff3f80','#ffb3cf','#ffffff','#ff8fb3','#ffd6e4'];
  function burst(x,y){
    var particles = [];
    var n = reduceMotion ? 0 : 46;
    for(var i=0;i<n;i++){
      var ang = (Math.PI*2*i)/n + Math.random()*0.2;
      var speed = 2+Math.random()*3;
      particles.push({
        x:x, y:y,
        vx:Math.cos(ang)*speed, vy:Math.sin(ang)*speed,
        life:1, color:fwColors[Math.floor(Math.random()*fwColors.length)]
      });
    }
    return particles;
  }
  function launchFireworks(){
    var allParticles = [];
    var bursts = 5;
    for(var b=0;b<bursts;b++){
      setTimeout(function(){
        var x = fwCanvas.width*(0.25+Math.random()*0.5);
        var y = fwCanvas.height*(0.2+Math.random()*0.35);
        allParticles = allParticles.concat(burst(x,y));
      }, b*260);
    }
    var start = performance.now();
    function frame(t){
      fctx.clearRect(0,0,fwCanvas.width,fwCanvas.height);
      allParticles.forEach(function(p){
        p.x += p.vx; p.y += p.vy; p.vy += 0.045; p.life -= 0.012;
        if(p.life>0){
          fctx.globalAlpha = Math.max(p.life,0);
          fctx.fillStyle = p.color;
          fctx.beginPath(); fctx.arc(p.x,p.y,2.4,0,Math.PI*2); fctx.fill();
        }
      });
      fctx.globalAlpha = 1;
      if(t-start < 3000){ requestAnimationFrame(frame); }
      else { fctx.clearRect(0,0,fwCanvas.width,fwCanvas.height); }
    }
    requestAnimationFrame(frame);
  }

  /* ---------------- stage navigation ---------------- */
  var stages = document.querySelectorAll('.stage');
  var current = 0;
  var nextFab = document.getElementById('nextFab');

  function showStage(n){
    stages.forEach(function(s){
      s.classList.toggle('active', parseInt(s.dataset.stage,10) === n);
    });
    current = n;
    nextFab.classList.remove('show');
  }
  nextFab.addEventListener('click', function(){
    if(current < 3) showStage(current+1);
  });

  /* ---------------- PAGE 0: password ---------------- */
  var PASSWORD = "1111";
  var entered = "";
  var display = document.getElementById('display');
  var errorMsg = document.getElementById('errorMsg');
  var keypad = document.getElementById('keypad');

  function renderDisplay(){
    display.textContent = entered.length ? entered : '\u00A0';
  }

  keypad.addEventListener('click', function(e){
    var btn = e.target.closest('.key');
    if(!btn) return;
    var k = btn.dataset.k;
    errorMsg.textContent = '\u00A0';

    if(k === 'clear'){
      entered = '';
      renderDisplay();
      return;
    }
    if(k === 'enter'){
      if(entered === PASSWORD){
        display.textContent = '✓ ✓ ✓';
        launchFireworks();
        setTimeout(function(){ showStage(1); }, 1400);
      } else {
        display.classList.add('shake');
        errorMsg.textContent = 'Enter correctly, my love';
        setTimeout(function(){ display.classList.remove('shake'); }, 400);
        entered = '';
        setTimeout(renderDisplay, 350);
      }
      return;
    }
    // digit
    if(entered.length < 6){
      entered += k;
      renderDisplay();
    }
  });
  renderDisplay();

  /* ---------------- PAGE 1: envelope + typewriter letter ---------------- */
  var envelopeBox = document.getElementById('envelopeBox');
  var envHint = document.getElementById('envHint');
  var letterPaper = document.getElementById('letterPaper');
  var letterTextEl = document.getElementById('letterText');
  var skipHint = document.getElementById('skipHint');

  var fullLetter = "Dear,\n           My Love,\n                       Happy Birthday to my sweet love! 🎂✨ Every single day with you feels special, but today is all about celebrating the amazing person you are. 💖 I’m so lucky to have you in my life, and I just wish I could wrap my arms around you right now and hold you tight. 🤗 Hugging you is my favorite place to be! ❤️ Count this text as a big, warm birthday hug until I can give you a real one in person! 🥳👑🥰 Have the happiest birthday, my love! 💕🎉";

  var typing = false, typeIndex = 0, typeTimer = null;

  function startTypewriter(){
    typing = true;
    typeIndex = 0;
    letterTextEl.textContent = '';
    function step(){
      if(typeIndex < fullLetter.length){
        letterTextEl.textContent += fullLetter.charAt(typeIndex);
        typeIndex++;
        typeTimer = setTimeout(step, 20);
      } else {
        typing = false;
        nextFab.classList.add('show');
      }
    }
    step();
  }
  function finishTypewriter(){
    clearTimeout(typeTimer);
    letterTextEl.textContent = fullLetter;
    typing = false;
    nextFab.classList.add('show');
  }

  envelopeBox.addEventListener('click', function(){
    envelopeBox.classList.add('hidden-el');
    envHint.style.display = 'none';
    letterPaper.classList.add('open');
    setTimeout(startTypewriter, 500);
  });
  letterPaper.addEventListener('click', function(){
    if(typing) finishTypewriter();
  });

  /* ---------------- PAGE 2: marry me ---------------- */
  var yesBtn = document.getElementById('yesBtn');
  var noBtn = document.getElementById('noBtn');
  var popupOverlay = document.getElementById('popupOverlay');
  var popupClose = document.getElementById('popupClose');

  yesBtn.addEventListener('click', function(){
    popupOverlay.classList.add('show');
  });
  popupClose.addEventListener('click', function(){
    popupOverlay.classList.remove('show');
    nextFab.classList.add('show');
  });
  noBtn.addEventListener('click', function(){
    var maxX = 60, maxY = 20;
    var dx = (Math.random()*maxX*2 - maxX);
    var dy = (Math.random()*maxY*2 - maxY);
    noBtn.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
  });

})();
</script>
